[package]
name = "glitzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust TUI that identifies Git-history-driven refactoring hotspots"
readme = "README.md"
repository = "https://github.com/JoBuRo/glitzer"
license = "Apache-2.0"
keywords = ["git", "tui", "refactoring", "hotspots", "analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
bytes = "1.10.1"
chrono = "0.4.42"
clap = { version = "4.5.50", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
flate2 = "1.1.5"
gix = "0.81.0"
hex = "0.4.3"
nom = "8.0.0"
ratatui = "0.30.0"
sha1 = "0.10.6"
similar = "2.7.0"

[dev-dependencies]
mockall = "0.14.0"
tempfile = "3.23.0"
