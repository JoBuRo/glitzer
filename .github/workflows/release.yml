name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust.yml
    with:
      comment-coverage: false

  publish:
    runs-on: ubuntu-latest
    needs: checks
    environment:
      name: crates-io-publish
    permissions:
      contents: read
      # id-token: write # Trusted publishing placeholder (enable after crates.io trusted publisher is configured)

    steps:
    - uses: actions/checkout@v4
    - name: Publish crate
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --locked
